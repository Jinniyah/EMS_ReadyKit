name: CI/CD — Test, Build, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION:  "3.11"
  NODE_VERSION:    "20"
  APP_DIR:         app
  FRONTEND_DIR:    frontend
  RESOURCE_GROUP:  rg-ems-readykit-dev
  APP_NAME:        app-ems-readykit-dev

jobs:
  # ── Job 1: Backend tests ────────────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ${{ env.APP_DIR }}
        run: pytest tests/ -v --tb=short

  # ── Job 2: Frontend build ───────────────────────────────────────────────────
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: ""
          VITE_APP_ENV: production
          # Azure AD credentials injected at build time so MSAL can authenticate.
          # Set VITE_AZURE_AD_TENANT_ID and VITE_AZURE_AD_CLIENT_ID as GitHub secrets.
          VITE_AZURE_AD_TENANT_ID: ${{ secrets.VITE_AZURE_AD_TENANT_ID }}
          VITE_AZURE_AD_CLIENT_ID: ${{ secrets.VITE_AZURE_AD_CLIENT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 1

  # ── Job 3: Deploy backend ───────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend to Azure App Service
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build deployment zip
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p /tmp/ems_stage
          cp -r alembic ems_readykit alembic.ini app.py Procfile \
                pyproject.toml requirements.txt startup.sh \
                /tmp/ems_stage/
          cd /tmp/ems_stage
          zip -r /tmp/deploy.zip .
          echo "Zip size: $(du -h /tmp/deploy.zip | cut -f1)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy zip to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: /tmp/deploy.zip

      - name: Verify backend health
        run: |
          echo "Polling health endpoint (max 10 min, 30s interval)..."
          HEALTH_URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
          MAX_ATTEMPTS=20
          SLEEP_SEC=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Backend is healthy."
              exit 0
            fi
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then sleep $SLEEP_SEC; fi
          done
          echo "✗ Backend health check failed after $((MAX_ATTEMPTS * SLEEP_SEC))s."
          curl -v --max-time 15 "$HEALTH_URL" 2>&1 || true
          exit 1

  # ── Job 4: Deploy frontend ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: List dist contents
        run: ls -la dist/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
