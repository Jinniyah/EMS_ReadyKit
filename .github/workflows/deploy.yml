name: CI/CD — Test, Build, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch so redundant pushes don't stack up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_DIR: app
  RESOURCE_GROUP: rg-ems-readykit-dev
  APP_NAME: app-ems-readykit-dev

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ${{ env.APP_DIR }}
        run: pytest tests/ -v --tb=short

  # ── Job 2: Build & Deploy ────────────────────────────────────────────────────
  # Only runs on pushes to main (not on pull requests) and only if tests pass.
  deploy:
    name: Build zip and deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment zip
        # Build on Linux so zip entries use forward-slash paths.
        # Windows Compress-Archive uses backslashes which Oryx's Linux
        # extractor cannot reconstruct as proper directories.
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p /tmp/ems_stage
          cp -r alembic ems_readykit alembic.ini app.py Procfile \
                pyproject.toml requirements.txt startup.sh \
                /tmp/ems_stage/
          cd /tmp/ems_stage
          zip -r /tmp/deploy.zip .
          echo "Zip size: $(du -h /tmp/deploy.zip | cut -f1)"
          echo "Zip contents:"
          unzip -l /tmp/deploy.zip | grep -E "alembic|startup|requirements" | sort

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy zip to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: /tmp/deploy.zip

      - name: Verify deployment health
        # F1 free tier has no always_on — every deploy is a cold start.
        # Cold start sequence: container spin-up → Oryx extraction →
        # startup.sh → Key Vault call → Alembic migrations → gunicorn init.
        # This can take 60–120s on F1. We poll every 30s for up to ~10 minutes.
        # Long interval reduces request count against the F1 quota while still
        # catching a healthy app within one polling cycle of it coming up.
        run: |
          echo "Polling health endpoint (max 10 min, 30s interval)..."
          HEALTH_URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
          MAX_ATTEMPTS=20
          SLEEP_SEC=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ App is healthy."
              exit 0
            fi
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              sleep $SLEEP_SEC
            fi
          done
          echo ""
          echo "✗ Health check failed after $((MAX_ATTEMPTS * SLEEP_SEC))s."
          echo ""
          echo "=== Verbose response from /health ==="
          curl -v --max-time 15 "$HEALTH_URL" 2>&1 || true
          echo ""
          echo "=== Last 200 lines of App Service console log ==="
          az webapp log download \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --log-file /tmp/applogs.zip 2>/dev/null || true
          if [ -f /tmp/applogs.zip ]; then
            unzip -p /tmp/applogs.zip "LogFiles/Application/*.txt" 2>/dev/null \
              | tail -200 || true
            unzip -p /tmp/applogs.zip "LogFiles/*.log" 2>/dev/null \
              | tail -200 || true
          fi
          exit 1
